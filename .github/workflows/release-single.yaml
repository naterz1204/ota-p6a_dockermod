name: Release single device

on:
  workflow_call:
    inputs:
      device-id:
        type: string
      magisk-preinit-device:
        type: string
        default: ''
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      device-id:
        description: Device ID
        required: true
        default: 'bluejay'
      magisk-preinit-device:
        description: Magisk preinit device
        required: false
        default: 'sda8'
      build-docker-kernel:
        description: Build custom Docker GKI kernel (Pixel 6a)
        type: boolean
        required: false
        default: false
      skip-rootless:
        description: skip building rootless OTA
        type: boolean
        required: false
      upload-test-ota:
        description: Upload OTA to test folder
        required: false
        type: boolean
      force-build:
        description: Force artifacts to be built and uploaded to release if non-existing
        required: false
        type: boolean
      force-ota-server-upload:
        description: Force OTA server upload
        required: false
        type: boolean
      skip-release:
        description: Skip release (build only)
        required: false
        type: boolean
      rooted-graphene-version:
        description: Git ref of rooted graphene repo to use
        required: false
      ota-version:
        description: OTA version
        required: false
      skip-pixincreate:
        description: skip building OTA rooted with pixincreate's magisk fork
        type: boolean
        required: false
        default: false
      additional-env:
        description: Additional env var key value pairs, space separated, e.g. "A=1 B=2"
        default: ''

permissions:
  contents: write

jobs:
  build-device:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Kernel compile + OTA patching can exceed 20 min
    steps:
      - name: Checkout rooted-graphene script repository
        uses: actions/checkout@v4
        with:
          repository: schnatterer/rooted-graphene
          ref: ${{ github.event.inputs.rooted-graphene-version || inputs.rooted-graphene-version || 'main' }} 
          fetch-depth: 1 # Efficent checkout, we only need the one ref
      - name: Checkout OTA repository for updating OTA server on GitHub Pages
        uses: actions/checkout@v4
        with:
          path: ota # Corresponds to PAGES_REPO_FOLDER
          fetch-depth: 0 # Allow for switching to github-pages branch
      - name: Set inputs
        # Empty means, use version defined in rooted-ota.sh
        # Note the difference between github.event.inputs (workflow_dispatch) and inputs (workflow_call)
        run: |
          echo "DEVICE_ID=$(echo '${{ github.event.inputs.device-id || inputs.device-id || 'shiba' }}' | xargs)" >> $GITHUB_ENV
          echo "MAGISK_PREINIT_DEVICE=$(echo '${{ github.event.inputs.magisk-preinit-device || inputs.magisk-preinit-device || '' }}' | xargs)" >> $GITHUB_ENV
          
          echo "OTA_VERSION=$(echo '${{ github.event.inputs.ota-version || '' }}' | xargs)" >> $GITHUB_ENV
          echo "FORCE_OTA_SERVER_UPLOAD=$(echo '${{ github.event.inputs.force-ota-server-upload || '' }}' | xargs)" >> $GITHUB_ENV
          echo "FORCE_BUILD=$(echo '${{ github.event.inputs.force-build || '' }}' | xargs)" >> $GITHUB_ENV
          echo "UPLOAD_TEST_OTA=$(echo '${{ github.event.inputs.upload-test-ota || '' }}' | xargs)" >> $GITHUB_ENV
          echo "SKIP_ROOTLESS=$(echo '${{ github.event.inputs.skip-rootless || '' }}' | xargs)" >> $GITHUB_ENV
          echo "SKIP_RELEASE=$(echo '${{ github.event.inputs.skip-release || '' }}' | xargs)" >> $GITHUB_ENV
          echo "SKIP_PIXINCREATE=$(echo '${{ github.event.inputs.skip-pixincreate || 'false' }}' | xargs)" >> $GITHUB_ENV
          echo "BUILD_DOCKER_KERNEL=$(echo '${{ github.event.inputs.build-docker-kernel || 'false' }}' | xargs)" >> $GITHUB_ENV
          
          if [[ "${{ github.event_name }}" == "push" ]]  || [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Running on push: Simple build without release for device $DEVICE_ID"
            echo "FORCE_BUILD=true" >> $GITHUB_ENV
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
          fi
          
          # Split additional-env and set each key-value pair as an environment variable
          IFS=' ' read -r -a env_vars <<< '${{ github.event.inputs.additional-env || '' }}'
          for key_value_pair in "${env_vars[@]}"; do
            echo "$key_value_pair" >> $GITHUB_ENV
          done
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl git bc bison flex libssl-dev libelf-dev lz4 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu clang llvm lld dwarves kmod \
            rsync cpio zstd libncurses-dev zlib1g-dev python3 libcap-dev
      - name: Build custom Docker GKI kernel and prepare prepatched boot
        if: env.BUILD_DOCKER_KERNEL == 'true'
        run: |
          set -euo pipefail
          echo "=== Building Docker-enabled GKI Kernel ==="
          export SKIP_CLEANUP=true
          export KBUILD_BUILD_USER=grapheneos
          export KBUILD_BUILD_HOST=github-actions
          . rooted-ota.sh
          findLatestVersion
          checkBuildNecessary
          downloadAndroidDependencies
          downloadAvBroot

          KERNEL_SRC_DIR="$RUNNER_TEMP/kernel"
          KERNEL_OUT_DIR="$RUNNER_TEMP/kernel_out"
          mkdir -p "$KERNEL_OUT_DIR"

          echo "=== Step 1: Inspecting stock vendor_dlkm for kernel requirements ==="
          mkdir -p .tmp/kernel_inspect
          .tmp/avbroot ota extract --input ".tmp/$OTA_TARGET.zip" --directory .tmp/kernel_inspect --partition vendor_dlkm --partition boot
          .tmp/avbroot avb unpack --input .tmp/kernel_inspect/vendor_dlkm.img --output-raw .tmp/kernel_inspect/vendor_dlkm_raw.img

          TARGET_VERMAGIC=$(strings .tmp/kernel_inspect/vendor_dlkm_raw.img | grep -m1 "vermagic=" | awk '{print $1}' | cut -d'=' -f2)
          EXPECTED_COMMIT=$(echo "$TARGET_VERMAGIC" | grep -oP '(?<=-g)[0-9a-f]{12}')
          EXPECTED_BRANCH=$(echo "$TARGET_VERMAGIC" | grep -oP '(?<=-)[a-zA-Z0-9]+(?=-[0-9]+-)')
          EXPECTED_KMI=$(echo "$TARGET_VERMAGIC" | grep -oP "(?<=-${EXPECTED_BRANCH}-)[0-9]+(?=-g)")
          EXPECTED_RANDSTRUCT=$(strings .tmp/kernel_inspect/vendor_dlkm_raw.img | grep -m1 "RANDSTRUCT_" | grep -oP '(?<=RANDSTRUCT_)[0-9a-f]{64}')

          echo "Target Vermagic:      $TARGET_VERMAGIC"
          echo "Expected Commit:      $EXPECTED_COMMIT"
          echo "Expected Branch:      $EXPECTED_BRANCH"
          echo "Expected KMI Gen:     $EXPECTED_KMI"
          echo "Expected RANDSTRUCT:  $EXPECTED_RANDSTRUCT"

          if [[ -z "$TARGET_VERMAGIC" || -z "$EXPECTED_COMMIT" || -z "$EXPECTED_BRANCH" || -z "$EXPECTED_KMI" ]]; then
            echo "ERROR: Failed to extract kernel requirements from stock vendor_dlkm. Aborting early."
            exit 1
          fi

          echo "Extracting stock vendor module signing certificate from stock boot image..."
          python3 - <<'EOF'
          import subprocess, tempfile

          bin_avbroot = '.tmp/avbroot'
          stock_boot = '.tmp/kernel_inspect/boot.img'
          with tempfile.TemporaryDirectory() as tmp:
              subprocess.run([bin_avbroot, 'avb', 'unpack', '--input', stock_boot, '--output-raw', f'{tmp}/raw.img'], check=True)
              subprocess.run([bin_avbroot, 'boot', 'unpack', '--input', f'{tmp}/raw.img', '--output-kernel', f'{tmp}/kernel.lz4'], check=True)
              subprocess.run(['lz4', '-d', '-f', f'{tmp}/kernel.lz4', f'{tmp}/kernel'], check=True)
              with open(f'{tmp}/kernel', 'rb') as f:
                  kdata = f.read()

          sig_str = b'Build time autogenerated kernel key'
          idx = kdata.find(sig_str)
          if idx != -1:
              for start in range(idx - 100, idx):
                  if kdata[start] == 0x30 and kdata[start+1] == 0x82:
                      cert_len = (kdata[start+2] << 8) | kdata[start+3]
                      total_len = cert_len + 4
                      cert_bytes = kdata[start:start+total_len]
                      proc = subprocess.run(['openssl', 'x509', '-inform', 'DER', '-outform', 'PEM'], input=cert_bytes, capture_output=True)
                      if proc.returncode == 0:
                          with open('.tmp/stock_cert.pem', 'wb') as out_f:
                              out_f.write(proc.stdout)
                          print(f"SUCCESS: Extracted stock vendor module signing certificate ({total_len} bytes).")
                          break
          EOF

          echo "=== Step 2: Resolving matching GrapheneOS kernel source tag/commit ==="
          # Try cloning candidate release tags first, fallback to commit lookup
          MATCHED=false
          for tag_cand in "${OTA_VERSION}" "${OTA_VERSION%01}00" "${OTA_VERSION%??}00"; do
            echo "Checking candidate kernel tag '$tag_cand'..."
            if git clone --depth 1 https://github.com/GrapheneOS/kernel_common-6.1.git -b "$tag_cand" "$KERNEL_SRC_DIR" 2>/dev/null; then
              cand_commit=$(git -C "$KERNEL_SRC_DIR" rev-parse --short=12 HEAD)
              if [[ "$cand_commit" == "$EXPECTED_COMMIT" ]]; then
                echo "SUCCESS: Found matching kernel tag $tag_cand with commit $cand_commit"
                MATCHED=true
                break
              else
                echo "Tag $tag_cand has commit $cand_commit, but vendor_dlkm requires $EXPECTED_COMMIT. Cleaning..."
                rm -rf "$KERNEL_SRC_DIR"
              fi
            fi
          done

          if [[ "$MATCHED" != 'true' ]]; then
            echo "Tags did not match. Fetching commit $EXPECTED_COMMIT directly from GrapheneOS/kernel_common-6.1..."
            git clone --depth 100 https://github.com/GrapheneOS/kernel_common-6.1.git "$KERNEL_SRC_DIR"
            if ! git -C "$KERNEL_SRC_DIR" checkout "$EXPECTED_COMMIT"; then
              echo "ERROR: Commit $EXPECTED_COMMIT not found in kernel_common-6.1! FAILING EARLY."
              exit 1
            fi
          fi

          ACTUAL_COMMIT=$(git -C "$KERNEL_SRC_DIR" rev-parse --short=12 HEAD)
          echo "Confirmed kernel commit: $ACTUAL_COMMIT"
          if [[ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "ERROR: Kernel commit mismatch ($ACTUAL_COMMIT != $EXPECTED_COMMIT). FAILING EARLY."
            exit 1
          fi

          echo "Deleting local tags in kernel repo to force git commit SHA suffix in vermagic..."
          git -C "$KERNEL_SRC_DIR" tag -d $(git -C "$KERNEL_SRC_DIR" tag -l) 2>/dev/null || true

          echo "Patching extract-cert.c for host OpenSSL 3 and preserving clean git tree..."
          sed -i 's|int main(int argc, char \*\*argv)|const char *key_pass = NULL;\nint main(int argc, char **argv)|' "$KERNEL_SRC_DIR/certs/extract-cert.c"
          git -C "$KERNEL_SRC_DIR" update-index --assume-unchanged certs/extract-cert.c

          export BRANCH="${EXPECTED_BRANCH}-6.1"
          export KMI_GENERATION="$EXPECTED_KMI"
          export KBUILD_BUILD_TIMESTAMP="$(TZ=UTC git -C "$KERNEL_SRC_DIR" log -1 --format=%cd --date=format-local:'%a %b %e %H:%M:%S UTC %Y')"

          if [[ -f .tmp/stock_cert.pem ]]; then
            echo "Installing stock certificate into kernel source certs directory..."
            cp .tmp/stock_cert.pem "$KERNEL_SRC_DIR/certs/stock_cert.pem"
          fi

          echo "Configuring GKI with Docker options out-of-tree..."
          make -C "$KERNEL_SRC_DIR" O="$KERNEL_OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          "$KERNEL_SRC_DIR/scripts/kconfig/merge_config.sh" -m -O "$KERNEL_OUT_DIR" "$KERNEL_OUT_DIR/.config" ota/docker.config
          if [[ -f "$KERNEL_SRC_DIR/certs/stock_cert.pem" ]]; then
            echo 'CONFIG_SYSTEM_TRUSTED_KEYS="certs/stock_cert.pem"' >> "$KERNEL_OUT_DIR/.config"
          fi
          make -C "$KERNEL_SRC_DIR" O="$KERNEL_OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "Compiling GKI Image with LLVM/Clang..."
          make -C "$KERNEL_SRC_DIR" O="$KERNEL_OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-D__ANDROID_COMMON_KERNEL__" BRANCH="$BRANCH" KMI_GENERATION="$KMI_GENERATION" --output-sync=target -j$(nproc) Image

          RAW_IMAGE="$KERNEL_OUT_DIR/arch/arm64/boot/Image"
          NEW_KERNEL="$KERNEL_OUT_DIR/arch/arm64/boot/Image.lz4"
          if [[ ! -f "$RAW_IMAGE" ]]; then
            echo "Error: Image not generated at $RAW_IMAGE"
            exit 1
          fi

          echo "=== Step 3: Fail-Early Verification of Compiled Kernel ==="
          BUILT_BANNER=$(strings "$RAW_IMAGE" | grep -m1 "Linux version")
          echo "Compiled kernel banner: $BUILT_BANNER"

          if ! echo "$BUILT_BANNER" | grep -q "$TARGET_VERMAGIC"; then
            echo "FATAL: Compiled kernel vermagic does NOT contain target '$TARGET_VERMAGIC'!"
            echo "Target: $TARGET_VERMAGIC"
            echo "Built:  $BUILT_BANNER"
            echo "FAILING EARLY to prevent flashing unbootable kernel."
            exit 1
          fi

          if echo "$BUILT_BANNER" | grep -q -- "-dirty"; then
            echo "FATAL: Kernel source tree was dirty (-dirty flag present). FAILING EARLY."
            exit 1
          fi

          echo "Verification SUCCESS: Vermagic strictly matches vendor_dlkm ($TARGET_VERMAGIC)."
          lz4 -c -l -12 "$RAW_IMAGE" > "$NEW_KERNEL"
          echo "Image.lz4 generated successfully."

          echo "Extracting stock boot image from OTA..."
          mkdir -p .tmp/boot_work
          .tmp/avbroot ota extract --input ".tmp/$OTA_TARGET.zip" --directory .tmp/extracted_boot --partition boot
          STOCK_BOOT=".tmp/extracted_boot/boot.img"

          echo "Unpacking stock AVB container from boot image..."
          .tmp/avbroot avb unpack --input "$STOCK_BOOT" --output-info .tmp/boot_work/avb.toml --output-raw .tmp/boot_work/raw_stock.img

          echo "Unpacking stock boot header and ramdisk from raw boot image..."
          .tmp/avbroot boot unpack --input .tmp/boot_work/raw_stock.img --output-header .tmp/boot_work/boot.toml --output-ramdisk-prefix .tmp/boot_work/ramdisk.img. --no-output-kernel

          echo "Repacking raw boot image with Docker GKI kernel..."
          .tmp/avbroot boot pack --input-header .tmp/boot_work/boot.toml --input-ramdisk-prefix .tmp/boot_work/ramdisk.img. --input-kernel "$NEW_KERNEL" --output .tmp/boot_work/raw_docker.img

          echo "Repacking AVB container around new raw boot image..."
          REPACKED_BOOT=".tmp/boot_docker.img"
          .tmp/avbroot avb pack --input-info .tmp/boot_work/avb.toml --input-raw .tmp/boot_work/raw_docker.img --output "$REPACKED_BOOT"

          echo "Hooking repacked boot into patchOTAs via rooted-ota.sh..."
          # avbroot ota patch treats <--magisk | --prepatched | --rootless> as mutually exclusive modes.
          # To patch Magisk INTO our custom boot image, we use --replace boot <image> along with --magisk:
          sed -i 's|args+=("--output" "$targetFile")|args+=("--output" "$targetFile")\n      args+=("--patch-arg=--replace" "--patch-arg" "boot" "--patch-arg" ".tmp/boot_docker.img")|g' rooted-ota.sh
          echo "Successfully wired replaced Docker boot image."

          echo "Patching uploadOtaServerData git checkout fallback..."
          sed -i 's|git checkout gh-pages|git checkout -B gh-pages origin/gh-pages 2>/dev/null \|\| git checkout gh-pages 2>/dev/null \|\| git checkout --orphan gh-pages|' rooted-ota.sh

          echo "Patching uploadFile to use official gh CLI with retries for large asset uploads..."
          python3 - <<'EOF'
          with open("rooted-ota.sh", "r") as f:
              content = f.read()

          old_func = """function uploadFile() {
            local sourceFileName="$1"
            local targetFileName="$2"
            local contentType="$3"

            # Note that --data-binary might lead to out of memory
            curl --fail -X POST -H "Authorization: token $GITHUB_TOKEN" \\
              -H "Content-Type: $contentType" \\
              --upload-file "$sourceFileName" \\
              "https://uploads.github.com/repos/$GITHUB_REPO/releases/$RELEASE_ID/assets?name=$targetFileName"
          }"""

          new_func = """function uploadFile() {
            local sourceFileName="$1"
            local targetFileName="$2"
            local contentType="$3"

            local attempt=1
            local max_attempts=5
            while [ $attempt -le $max_attempts ]; do
              echo "Uploading asset $sourceFileName (attempt $attempt/$max_attempts)..."
              if gh release upload "$OTA_VERSION" "$sourceFileName" --clobber --repo "$GITHUB_REPO"; then
                echo "Successfully uploaded $sourceFileName"
                return 0
              fi
              echo "Upload failed. Waiting 10s before retry..."
              sleep 10
              attempt=$((attempt + 1))
            done
            echo "Failed to upload $sourceFileName after $max_attempts attempts."
            return 1
          }"""

          if old_func in content:
              content = content.replace(old_func, new_func)
              with open("rooted-ota.sh", "w") as f:
                  f.write(content)
              print("uploadFile function replaced successfully.")
          else:
              print("WARNING: old uploadFile signature not matched exactly.")
          EOF

          echo "Resetting ota worktree to clean git state for gh-pages..."
          git -C ota reset --hard HEAD
          git -C ota clean -fd
      - name: release
        env:
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
          KEY_AVB_BASE64: ${{ secrets.KEY_AVB_BASE64 }}
          CERT_OTA_BASE64: ${{ secrets.CERT_OTA_BASE64 }}
          KEY_OTA_BASE64: ${{ secrets.KEY_OTA_BASE64 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PAGES_REPO_FOLDER: 'ota'
        run: |
          if [[ $SKIP_RELEASE == 'true' ]]; then
            DEBUG=1 bash -c '. rooted-ota.sh && createRootedOta && createOtaServerData'
          else
            DEBUG=1 bash -c '. rooted-ota.sh && createAndReleaseRootedOta'
          fi